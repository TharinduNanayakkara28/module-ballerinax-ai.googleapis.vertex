[package]
authors = ["Ballerina"]
distribution = "2201.12.0"
keywords = ["Agent", "Model Provider", "Embedding Provider", "Vendor/Google", "Area/AI & Machine Learning", "Type/Embedding Provider", "Type/Model Provider", "Type/Connector", "Name/Vertex AI Model/Embedding Provider"]
license = ["Apache-2.0"]
icon = "icon.png"
name = "ai.googleapis.vertex"
org = "ballerinax"
repository = "https://github.com/ballerina-platform/module-ballerinax-ai.googleapis.vertex"
version = "1.0.1"

# TODO: Remove this block before merging.
# The streaming API (`ai:ChatCompletionChunk`, `ModelProvider.chatStream`,
# `ModelProvider.generateStream`) is not in any published `ballerina/ai` release yet;
# it exists only in the local build of the `feat/add-chat-stream-support` branch of
# module-ballerina-ai. The latest on Ballerina Central is 1.14.1 and it does not carry
# the contract. Once that lands and is released, drop `repository = "local"` and let
# this resolve from central.
[[dependency]]
org = "ballerina"
name = "ai"
version = "1.13.0"
repository = "local"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "ai.googleapis.vertex-native"
version = "1.0.1"
path = "../native/build/libs/ai.googleapis.vertex-native-1.0.1-SNAPSHOT.jar"
